name = "tattica-chat-ia"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Endereços do site que podem usar o proxy, separados por vírgula. Vazio libera qualquer origem.
ORIGENS_PERMITIDAS = ""

[dev]
# Porta fixa: o chat (iaUrlLocal em chat-config.js) chama http://127.0.0.1:8787
port = 8787
ip = "127.0.0.1"
